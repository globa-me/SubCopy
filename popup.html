<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 270px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 13px;
      background: #ffffff;
      color: #0f172a;
    }
    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #64748b;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .section {
      margin-bottom: 11px;
    }
    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    button, select {
      font-family: inherit;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.05s ease, box-shadow 0.15s ease;
    }
    button:active {
      transform: scale(0.98);
    }
    button:disabled, select:disabled {
      cursor: not-allowed;
      opacity: 0.55;
      transform: none;
    }
    select {
      width: 100%;
      padding: 7px 8px;
      font-size: 12px;
      background: #f8fafc;
      color: #0f172a;
      margin-bottom: 6px;
      outline: none;
      appearance: auto;
    }
    select:focus {
      border-color: #059669;
      background: #ffffff;
      box-shadow: 0 0 0 2px rgba(5, 150, 105, 0.15);
    }
    .btn-primary {
      width: 100%;
      padding: 8px 6px;
      font-size: 12px;
      font-weight: 600;
      background: #059669;
      color: #ffffff;
      border: none;
      box-shadow: 0 1px 2px rgba(5, 150, 105, 0.2);
    }
    .btn-primary:hover {
      background: #047857;
    }
    .btn-secondary {
      width: 100%;
      padding: 8px 6px;
      font-size: 12px;
      font-weight: 500;
      background: #f8fafc;
      color: #334155;
      border: 1px solid #cbd5e1;
    }
    .btn-secondary:hover {
      background: #f1f5f9;
      color: #0f172a;
      border-color: #94a3b8;
    }
    .btn-accent {
      width: 100%;
      padding: 8px 6px;
      font-size: 12px;
      font-weight: 600;
      background: #eff6ff;
      color: #2563eb;
      border: 1px solid #bfdbfe;
    }
    .btn-accent:hover {
      background: #dbeafe;
      border-color: #93c5fd;
    }
    .status {
      display: none;
      margin-bottom: 10px;
      padding: 8px 9px;
      border: 1px solid #bfdbfe;
      border-radius: 6px;
      background: #eff6ff;
      color: #1d4ed8;
      font-size: 11px;
      line-height: 1.35;
    }
    .status.error {
      border-color: #fecaca;
      background: #fef2f2;
      color: #b91c1c;
    }
    footer {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid #f1f5f9;
      font-size: 10px;
      text-align: center;
    }
    footer a {
      color: #94a3b8;
      text-decoration: none;
    }
    footer a:hover {
      color: #64748b;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div id="statusMessage" class="status" role="status" aria-live="polite"></div>

  <div class="section">
    <div class="section-title" id="sectionSubtitlesTitle"></div>
    <select id="langSelect" disabled>
      <option value="" id="selectPlaceholder"></option>
    </select>
    <div class="btn-grid">
      <button id="copyWithTimestamps" class="btn-primary" disabled></button>
      <button id="copyWithoutTimestamps" class="btn-secondary" disabled></button>
    </div>
  </div>

  <div class="section">
    <div class="section-title" id="sectionCoverTitle"></div>
    <div class="btn-grid">
      <button id="downloadCover" class="btn-secondary" disabled></button>
      <button id="copyCover" class="btn-secondary" disabled></button>
    </div>
  </div>

  <div class="section" style="margin-bottom: 6px;">
    <div class="section-title" id="sectionInfoTitle"></div>
    <button id="copyAllInfo" class="btn-accent" disabled></button>
  </div>

  <footer>
    <a id="popupFooter" href="#" target="_blank" rel="noopener noreferrer"></a>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
